name: Build test app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create app files
        run: |
          mkdir -p app/src/main/java/uk/hozdogus/grocerytracker

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GroceryTracker"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'uk.hozdogus.grocerytracker'
              compileSdk 34
              defaultConfig {
                  applicationId 'uk.hozdogus.grocerytracker'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '0.1-test'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Grocery Test" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/uk/hozdogus/grocerytracker/MainActivity.java <<'EOF'
          package uk.hozdogus.grocerytracker;

          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {

              static final String ASDA = "https://www.asda.com/groceries/product/kids-yogurts-fromage-frais/yeo-valley-organic-fruity-favourites-whole-milk-yogurt-4-x-85g/7518557";
              static final String SAINSBURYS = "https://www.sainsburys.co.uk/groceries/product/yeo-valley-organic-little-yeos-fruity-favourites-kids-yogurt-selection-4x85g";

              static final String EXTRACT_JS = """
                  (function(){
                    var r = {title: document.title, prices: [], ld: [], meta: null, blocked: false};
                    var t = document.body ? document.body.innerText : '';
                    r.blocked = /access denied|are you a robot|captcha|request blocked|forbidden|verify you are human/i.test(t.slice(0, 3000) + ' ' + document.title);
                    document.querySelectorAll('script[type="application/ld+json"]').forEach(function(s){
                      var m = s.textContent.match(/"price"\\s*:\\s*"?[\\d.]+/g);
                      if (m) r.ld = r.ld.concat(m);
                    });
                    var mt = document.querySelector('meta[property="product:price:amount"], meta[itemprop="price"]');
                    if (mt) r.meta = mt.getAttribute('content');
                    var m = t.match(/\\u00a3\\s?\\d+\\.\\d\\d/g);
                    if (m) r.prices = Array.from(new Set(m)).slice(0, 8);
                    return JSON.stringify(r);
                  })()
                  """;

              TextView log;
              WebView web;
              Handler handler = new Handler(Looper.getMainLooper());
              String currentShop = "";
              int tries = 0;
              int httpStatus = 0;
              boolean done = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 48, 24, 24);

                  LinearLayout buttons = new LinearLayout(this);
                  Button asda = new Button(this);
                  asda.setText("Test Asda");
                  asda.setOnClickListener(v -> start("Asda", ASDA));
                  Button sains = new Button(this);
                  sains.setText("Test Sainsbury's");
                  sains.setOnClickListener(v -> start("Sainsbury's", SAINSBURYS));
                  buttons.addView(asda);
                  buttons.addView(sains);
                  root.addView(buttons);

                  log = new TextView(this);
                  log.setTextSize(15);
                  log.setText("Tap a button to test reading the yogurt price.\n");
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(log);
                  root.addView(scroll, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setUserAgentString(s.getUserAgentString().replace("; wv", ""));
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          httpStatus = 0;
                      }
                      @Override
                      public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse response) {
                          if (request.isForMainFrame()) httpStatus = response.getStatusCode();
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (!done && tries == 0) poll();
                      }
                  });
                  root.addView(web, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);
              }

              void start(String shop, String url) {
                  handler.removeCallbacksAndMessages(null);
                  currentShop = shop;
                  tries = 0;
                  done = false;
                  log.append("\n⏳ Loading " + shop + "…\n");
                  web.loadUrl(url);
              }

              void poll() {
                  if (done) return;
                  tries++;
                  web.evaluateJavascript(EXTRACT_JS, value -> {
                      try {
                          JSONObject r = new JSONObject(new JSONArray("[" + value + "]").getString(0));
                          JSONArray prices = r.getJSONArray("prices");
                          JSONArray ld = r.getJSONArray("ld");
                          boolean blocked = r.getBoolean("blocked");
                          boolean found = !blocked && (prices.length() > 0 || ld.length() > 0 || !r.isNull("meta"));
                          if (found || tries >= 12) {
                              done = true;
                              StringBuilder b = new StringBuilder();
                              b.append(found ? "✅ " : "❌ ").append(currentShop);
                              if (httpStatus != 0) b.append(" (HTTP ").append(httpStatus).append(")");
                              b.append("\nPage: ").append(r.optString("title"));
                              if (prices.length() > 0) b.append("\nPrices seen: ").append(prices.join(", ").replace("\"", ""));
                              if (ld.length() > 0) b.append("\nProduct data: ").append(ld.join(", ").replace("\\\"", ""));
                              if (!r.isNull("meta")) b.append("\nMeta price: ").append(r.optString("meta"));
                              if (blocked) b.append("\nLooks like a block/robot check page.");
                              log.append(b.append("\n").toString());
                          } else {
                              handler.postDelayed(this::poll, 2000);
                          }
                      } catch (Exception e) {
                          if (tries >= 12) {
                              done = true;
                              log.append("❌ " + currentShop + ": couldn't read page (" + e.getMessage() + ")\n");
                          } else {
                              handler.postDelayed(this::poll, 2000);
                          }
                      }
                  });
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GroceryTracker-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
